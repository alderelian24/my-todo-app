trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  - group: AzureServiceConnection
  # Docker Registry connection details
  - name: dockerRegistryServiceConnection
    value: 'acrtodoapp-docker-conn' # Nombre de la Service Connection tipo Docker Registry
  - name: imageRepository
    value: 'todo-app'
  - name: containerRegistry
    value: 'acrtodoapp.azurecr.io' # Reemplazar con el ACR login server generado por Terraform
  - name: dockerfilePath
    value: '$(Build.SourcesDirectory)/Dockerfile'
  - name: tag
    value: '$(Build.BuildId)'

stages:
- stage: Test
  displayName: 'Pruebas Unitarias'
  jobs:
  - job: RunTests
    displayName: 'Ejecutar Tests con Vitest'
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '18.x'
      displayName: 'Instalar Node.js'

    - script: |
        npm ci
      displayName: 'Instalar Dependencias'

    - script: |
        npm run test
      displayName: 'Ejecutar Tests Unitarios'

- stage: Build
  displayName: 'Compilación y Publicación Docker'
  dependsOn: Test
  condition: succeeded()
  jobs:
  - job: BuildAndPush
    displayName: 'Construir y Subir Imagen a ACR'
    steps:
    - task: Docker@2
      displayName: 'Build y Push al Azure Container Registry'
      inputs:
        containerRegistry: '$(dockerRegistryServiceConnection)'
        repository: '$(imageRepository)'
        command: 'buildAndPush'
        Dockerfile: '$(dockerfilePath)'
        tags: |
          $(tag)
          latest
